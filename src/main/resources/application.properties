spring.application.name=delivery-fee-service
server.port=8080

# File-backed H2 keeps database contents between application restarts.
spring.datasource.url=jdbc:h2:file:./data/weatherdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

weather.feed-url=https://www.ilmateenistus.ee/ilma_andmed/xml/observations.php
weather.import.cron=0 15 * * * *
weather.import.zone=Europe/Tallinn

springdoc.swagger-ui.path=/swagger-ui.html
